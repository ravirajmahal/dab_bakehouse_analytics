# This is a Declarative Automation Bundle definition for backhouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: backhouse_analytics
  uuid: ee589f15-583e-473f-95ef-978cafe19fe4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-155b6b04-f8f8.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-155b6b04-f8f8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ravirajmahal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ravirajmahal@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
    permissions:
      - user_name: ravirajmahal@gmail.com
        level: CAN_MANAGE
